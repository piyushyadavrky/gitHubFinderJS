<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="./css-gitFinderJS/gitFinderJS.css">
</head>
<body>
  <div class="mainDiv">

    <div class="mainTitle">GitHub Profile Viewer</div>
  
    <div class="searchBoxDiv">
      <div class="inputBoxDiv">
        <input placeholder="Username" type="text" class="inputBox">
      </div>
      <div class="searchButtonDiv">
        <button class="searchButton">Search</button>
      </div>
    </div>


    <div class="mainInfoPage">

      <div class="photoNameUsernameDiv">
        <div class="photoDiv">
          <img src="./images-gitFinderJS/maxverstappenimghhh.png" class="photo">
        </div>
        <div class="nameUsernameDiv">
          <div class="nameDiv">
            Piyush Yadav
          </div>
          <div class="usernameDiv">
            piyushyadavrky
          </div>
        </div>
      </div>

      <div class="bioDiv">
        <div class="biochildDiv">
          <div class="bioTextDiv">Bio:</div>
          <div class="bioShowDiv">
            Hii, i'm Piyush Yadav..
          </div>
        </div>
      </div>

      <div class="statsDiv">
        <div class="statsChildDiv">
          <div class="reposShowDiv">
            <div class="reposTextDiv">
              Repos
            </div>
            <div class="reposDiv">
              2
            </div>
          </div>
          <div class="followersShowDiv">
            <div class="followersTextDiv">
              Followers
            </div>
            <div class="followersDiv">
              3
            </div>
          </div>
          <div class="followingShowDiv">
            <div class="followingTextDiv">
              Following
            </div>
            <div class="followingDiv">
              4
            </div>
          </div>
        </div>
      </div>


      <div class="extraStatsDiv">
        <div class="extraStatsChildDiv">
          <div class="countryShowDiv">
            India
          </div>
          <div class="githubLinkDiv">
            github.com/piyushyadavrky
          </div>
        </div>
      </div>





    </div>



  </div>


  <script src="./JS-gitFinderJS/gitFinderJS.js"></script>
</body>
</html>
